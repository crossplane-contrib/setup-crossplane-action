name: Setup Crossplane
description: Install a SHA-256 verified Crossplane CLI and add it to the PATH, optionally caching the binary.

inputs:
  version:
    description: |
      Version of the Crossplane CLI to install, e.g. `v2.5.0`. Must be an exact
      version; `current` and `latest` are not accepted.
    # renovate: datasource=github-releases depName=crossplane/cli
    default: v2.5.0

  channel:
    description: |
      Release channel of the Crossplane CLI to install (e.g. `stable`, `master`).
    default: stable

  checksum:
    description: |
      Optional SHA-256 of the Crossplane CLI binary for this runner's platform.
      When set, the binary must match it. When empty, the binary is verified
      against the `.sha256` file published next to it upstream.
    default: ""

  cache:
    description: Whether to cache the binary with actions/cache (`true` or `false`).
    default: "true"

  cache-prefix:
    description: Prefix for the cache key.
    default: crossplane

outputs:
  cache-hit:
    description: Whether the binary was restored from the cache.
    value: ${{ steps.cache.outputs.cache-hit || 'false' }}
  downloaded:
    description: Whether the binary was downloaded during this run.
    value: ${{ steps.install.outputs.downloaded }}
  version:
    description: Version reported by the installed binary.
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed `crossplane` binary.
    value: ${{ steps.resolve.outputs.bin }}

runs:
  using: composite

  steps:
    - name: Resolve download
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_CHECKSUM: ${{ inputs.checksum }}
        INPUT_CACHE: ${{ inputs.cache }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail

        fail() { echo "::error title=setup-crossplane::$*"; exit 1; }

        # --- version -----------------------------------------------------------
        version="${INPUT_VERSION}"
        case "${version}" in
          current|latest|"")
            fail "version must be an exact release such as v2.5.0 (got '${version}'); 'current' and 'latest' are not reproducible" ;;
        esac
        [[ "${version}" == v* ]] || version="v${version}"
        if ! [[ "${version}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
          fail "invalid version '${INPUT_VERSION}'; expected something like v2.5.0"
        fi
        major="${BASH_REMATCH[1]}"
        minor="${BASH_REMATCH[2]}"

        # --- channel / checksum / cache -----------------------------------------
        [[ "${INPUT_CHANNEL}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "invalid channel '${INPUT_CHANNEL}'"

        checksum="$(printf '%s' "${INPUT_CHECKSUM}" | tr '[:upper:]' '[:lower:]')"
        if [[ -n "${checksum}" && ! "${checksum}" =~ ^[0-9a-f]{64}$ ]]; then
          fail "checksum must be a 64-character hex SHA-256 digest"
        fi

        case "${INPUT_CACHE}" in
          true|false) ;;
          *) fail "cache must be 'true' or 'false' (got '${INPUT_CACHE}')" ;;
        esac

        # --- platform -----------------------------------------------------------
        case "${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}" in
          Linux/X64)     platform=linux_amd64 ;;
          Linux/ARM64)   platform=linux_arm64 ;;
          Linux/ARM)     platform=linux_arm ;;
          macOS/X64)     platform=darwin_amd64 ;;
          macOS/ARM64)   platform=darwin_arm64 ;;
          Windows/X64)   platform=windows_amd64 ;;
          *) fail "unsupported runner platform ${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}" ;;
        esac
        exe=""
        [[ "${RUNNER_OS_NAME}" == Windows ]] && exe=".exe"

        # --- upstream location --------------------------------------------------
        # v2.3.0 was the first release from crossplane/cli, published to
        # cli.crossplane.io as "crossplane". Older releases live on
        # releases.crossplane.io and are named "crank".
        if (( major < 2 || (major == 2 && minor < 3) )); then
          host=releases.crossplane.io
          upstream_name=crank
        else
          host=cli.crossplane.io
          upstream_name=crossplane
        fi
        url="https://${host}/${INPUT_CHANNEL}/${version}/bin/${platform}/${upstream_name}${exe}"

        # --- install location ---------------------------------------------------
        temp="${RUNNER_TEMP}"
        if command -v cygpath >/dev/null 2>&1; then
          temp="$(cygpath -m "${temp}")"
        fi
        dir="${temp}/setup-crossplane/${INPUT_CHANNEL}/${version}/${platform}"

        {
          echo "version=${version}"
          echo "checksum=${checksum}"
          echo "url=${url}"
          echo "temp=${temp}"
          echo "dir=${dir}"
          echo "bin=${dir}/crossplane${exe}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore cache
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-${{ steps.resolve.outputs.version }}-v2

    - name: Download, verify and install
      id: install
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        VERSION: ${{ steps.resolve.outputs.version }}
        CHECKSUM: ${{ steps.resolve.outputs.checksum }}
        URL: ${{ steps.resolve.outputs.url }}
        TEMP_DIR: ${{ steps.resolve.outputs.temp }}
        DIR: ${{ steps.resolve.outputs.dir }}
        BIN: ${{ steps.resolve.outputs.bin }}
      # The PATH entry is built only from validated inputs and RUNNER_TEMP.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail

        # Never leave an unverified binary where actions/cache would save it.
        fail() {
          echo "::error title=setup-crossplane::$*"
          rm -rf "${DIR}"
          exit 1
        }

        fetch() {
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 \
            "$@"
        }

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # Pick the file to verify: a cached binary, or a fresh download that is
        # staged outside the install dir until it has been verified.
        downloaded=false
        if [[ "${CACHE_HIT}" == "true" ]]; then
          echo "Using cached binary ${BIN}"
          candidate="${BIN}"
          [[ -f "${candidate}" ]] || fail "cache hit but ${BIN} is missing"
        else
          staging="$(mktemp -d "${TEMP_DIR}/setup-crossplane-dl.XXXXXX")"
          trap 'rm -rf "${staging}"' EXIT
          candidate="${staging}/crossplane"
          echo "Downloading ${URL}"
          fetch --output "${candidate}" "${URL}" \
            || fail "failed to download ${URL}; check that ${VERSION} exists on this channel"
          downloaded=true
        fi

        # Determine the expected digest.
        if [[ -n "${CHECKSUM}" ]]; then
          expected="${CHECKSUM}"
          echo "Verifying against the pinned checksum input"
        else
          expected="$(fetch "${URL}.sha256" | awk 'NR==1 {print tolower($1)}')" \
            || fail "failed to download ${URL}.sha256"
          echo "::notice title=setup-crossplane::Verified against upstream ${URL}.sha256. Set the 'checksum' input to pin a known-good digest."
        fi
        [[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || fail "expected checksum is not a SHA-256 digest: '${expected}'"

        actual="$(sha256_of "${candidate}")"
        if [[ "${actual}" != "${expected}" ]]; then
          rm -f "${candidate}"
          fail "checksum mismatch for ${URL}: expected ${expected}, got ${actual}"
        fi
        echo "SHA-256 OK: ${actual}"

        if [[ "${downloaded}" == "true" ]]; then
          mkdir -p "${DIR}"
          mv -f "${candidate}" "${BIN}"
        fi
        chmod +x "${BIN}"

        # Make sure the binary runs and is the version that was asked for.
        reported="$("${BIN}" version --client | sed -n 's/^Client Version: *//p' | head -n1)" \
          || fail "failed to run ${BIN} version --client"
        if [[ "${reported}" != "${VERSION}" ]]; then
          fail "installed binary reports version '${reported}', expected '${VERSION}'"
        fi
        echo "Installed Crossplane CLI ${reported} at ${BIN}"

        # Entries in GITHUB_PATH are prepended, so this binary takes precedence
        # over any crossplane already on the PATH.
        echo "${DIR}" >> "${GITHUB_PATH}"

        {
          echo "downloaded=${downloaded}"
          echo "version=${reported}"
        } >> "${GITHUB_OUTPUT}"
